name: Release

# Push a tag to publish a release, e.g.:
#   git tag -a v0.2.0 -m "What changed"   (the message becomes the release notes)
#   git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      # Pinned to a commit: this job holds the signing secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build number is the commit count.
          fetch-depth: 0

      - name: Read version and notes from the tag
        id: tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.2.3, got $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Checkout replaces annotated tags with lightweight ones; fetch the real tag for its message.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          # Drop the tag's signature (PGP, SSH or X.509), which git appends to the message.
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/^-----BEGIN .*-----$/,$d' > "$RUNNER_TEMP/notes.txt"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # No package cache here: Sparkle's tools come from .build/artifacts and receive the private
      # key, so they are downloaded fresh (and checksum-verified by SwiftPM) for every release.
      - name: Run tests
        run: swift test

      - name: Import signing certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Build, sign and write the appcast
        env:
          ONESHOT_VERSION: ${{ steps.tag.outputs.version }}
          ONESHOT_SIGN_IDENTITY: OneShot Release Signing
          ONESHOT_RELEASE_NOTES: ${{ runner.temp }}/notes.txt
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/release.sh

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          notes=(--generate-notes)
          if [[ -s "$RUNNER_TEMP/notes.txt" ]]; then notes=(--notes-file "$RUNNER_TEMP/notes.txt"); fi
          gh release create "$GITHUB_REF_NAME" \
            "build/releases/OneShot-$VERSION.zip" \
            build/releases/appcast.xml \
            --title "OneShot $VERSION" \
            --verify-tag \
            "${notes[@]}"

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
