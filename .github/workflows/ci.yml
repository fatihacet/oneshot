name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    # Xcode 26 or later is needed to compile the Icon Composer app icon.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the commit count.
          fetch-depth: 0

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Run tests
        run: swift test

      - name: Build app
        # No signing identity on the runner, so the app is signed ad hoc.
        run: |
          ./scripts/build-app.sh
          # ditto keeps the framework symlinks that a plain artifact upload would flatten.
          ditto -c -k --sequesterRsrc --keepParent build/OneShot.app build/OneShot.zip

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: OneShot-${{ github.sha }}
          path: build/OneShot.zip
          retention-days: 14
